<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fictional Portal: Log in</title></head>
<body>
<div id="banner"><p>We use cookies.</p>
  <button id="accept-cookies" onclick="document.getElementById('banner').remove()">Accept</button></div>
<h1>Log in</h1>
<form method="post" action="/login">
  <label>User <input id="username" name="user" autocomplete="off"></label>
  <label>Password <input id="password" name="password" type="password"></label>
  <button type="submit">Continue</button>
</form>
</body>
</html>
