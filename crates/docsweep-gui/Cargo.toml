[package]
name = "docsweep-gui"
description = "Desktop app of Docsweep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Cargo builds `docsweep-gui` so it cannot collide with the `docsweep` CLI, not
# even on case-insensitive file systems. Bundling renames it to the documented
# name through `mainBinaryName`.
[[bin]]
name = "docsweep-gui"
path = "src/main.rs"

[dependencies]
docsweep-core.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }
