[package]
name = "docsweep-gui"
description = "Desktop app of Docsweep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Cargo builds `docsweep-gui` so it cannot collide with the `docsweep` CLI, not
# even on case-insensitive file systems. Bundling renames it to the documented
# name through `mainBinaryName`.
[[bin]]
name = "docsweep-gui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
docsweep-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
